<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>县域食品安全风险处置台</title>
<style>
:root{--ink:#142334;--blue:#176a9d;--paper:#f5f3ec;--line:#d7d7ce;--red:#b6342e;--orange:#c97921;--yellow:#b99c20;--muted:#697681}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e6edf0,#f5f3ec)}.loginbox{width:min(430px,92vw);padding:34px;background:#fff;border-top:7px solid var(--blue);box-shadow:0 12px 35px #1b2f3d1c}.eyebrow{color:var(--blue);letter-spacing:.13em;font-weight:bold;font-size:12px}.login h1{font-size:29px;margin:12px 0}.login p{line-height:1.7;color:#56636d}.field{display:grid;gap:6px;margin:15px 0}.field input,.field select,input,textarea,select{padding:10px;border:1px solid #bfc8cd;background:#fff;width:100%}textarea{min-height:72px;resize:vertical}.primary{background:var(--blue);color:#fff;border:0;padding:11px 17px;font-weight:bold}.shell{max-width:1460px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding:8px 0 15px}.head h1{font-size:25px;margin:5px 0}.head small{color:var(--muted)}.user{display:flex;align-items:center;gap:10px}.ghost{border:1px solid #9ba8ad;background:transparent;padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.metric{padding:15px;border-left:4px solid var(--blue);background:#fff}.metric.red{border-color:var(--red)}.metric.orange{border-color:var(--orange)}.metric b{display:block;font:30px Georgia,serif;margin-top:7px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:17px;margin-top:17px}.panel{background:#fff;border:1px solid var(--line);padding:17px}.panel h2{font-size:16px;margin:0 0 14px}.towns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.town{padding:14px;background:#edf2ec;border-top:3px solid #7c9d80}.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin:7px 4px 0 0}.red{background:var(--red)}.orange{background:var(--orange)}.yellow{background:var(--yellow)}table{width:100%;border-collapse:collapse}th{text-align:left;color:#61707b;font-weight:normal;background:#eef2f2}td,th{padding:10px 8px;border-bottom:1px solid #e3e6e5;vertical-align:top}.badge{padding:3px 7px;color:#fff;font-size:12px}.status{color:#53606a}.rowbtn{border:0;background:none;color:var(--blue);text-decoration:underline}.new{display:grid;grid-template-columns:1fr 160px auto;gap:9px;align-items:end}.notice{margin:12px 0;padding:10px;background:#e7f0f4;color:#205775}.modal{position:fixed;inset:0;background:#10243577;display:grid;place-items:center;padding:15px}.modal>div{max-width:690px;width:100%;max-height:90vh;overflow:auto;background:#fff;padding:22px}.actions{display:grid;gap:9px;margin-top:15px}.timeline{margin:18px 0;border-left:2px solid #b5c2c9;padding-left:14px}.event{margin:11px 0}.event time{color:#71808a;font-size:12px}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.metrics,.towns{grid-template-columns:repeat(2,1fr)}.new{grid-template-columns:1fr}.head{align-items:start;gap:12px;flex-direction:column}.shell{padding:12px}table{font-size:12px}td,th{padding:8px 4px}}
</style><body><main id="app"></main><script>
const app=document.querySelector('#app');let state;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json().catch(()=>({error:'服务返回格式异常'}));if(!r.ok)throw Error(d.error||'请求失败');return d}
function login(){app.innerHTML=`<section class="login"><form class="loginbox" id="login"><div class="eyebrow">LOCAL DEMO · 脱敏模拟数据</div><h1>县域食品安全<br>风险处置台</h1><p>演示“县级派乡镇、乡镇派网格、核查复核、县级销号”的流程。风险等级和分数为固定演示规则，不是执法结论。</p><label class="field">演示账号<select name="username"><option value="county">county · 县级监管员</option><option value="town_a">town_a · 青禾镇负责人</option><option value="town_b">town_b · 临江镇负责人</option><option value="town_c">town_c · 石桥镇负责人</option><option value="grid_a">grid_a · 青禾镇网格员</option><option value="grid_b">grid_b · 临江镇网格员</option><option value="grid_c">grid_c · 石桥镇网格员</option></select></label><label class="field">密码<input name="password" type="password" value="DemoFood!2026"></label><button class="primary">进入工作台</button><p id="err"></p></form></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(x){document.querySelector('#err').textContent=x.message}}}
function lvl(x){return `<span class="badge ${x==='红'?'red':x==='橙'?'orange':'yellow'}">${x}</span>`}
function towns(risks){return [...new Set(risks.map(x=>x.town))].map(t=>{let rows=risks.filter(x=>x.town===t), open=rows.filter(x=>x.status!=='已处置');return `<div class="town"><b>${esc(t)}</b><br><small>待处置 ${open.length} / 共 ${rows.length}</small><br>${rows.map(x=>`<span class="dot ${x.level==='红'?'red':x.level==='橙'?'orange':'yellow'}" title="${x.level}色风险"></span>`).join('')}</div>`}).join('')}
function render(){let {user,metrics,risks,tasks,campaigns}=state;app.innerHTML=`<div class="shell"><header class="head"><div><div class="eyebrow">${esc(user.area)} · 食品安全日常监管</div><h1>风险处置工作台</h1><small>风险分级为演示规则；最终处置由监管人员判断。</small></div><div class="user"><span>${esc(user.name)} / ${esc(user.role)}</span><button class="ghost" id="out">退出</button></div></header><section class="metrics"><div class="metric"><span>待处理任务</span><b>${metrics.active}</b></div><div class="metric red"><span>未处置红色风险</span><b>${metrics.red}</b></div><div class="metric orange"><span>待复核</span><b>${metrics.review}</b></div><div class="metric"><span>已逾期任务</span><b>${metrics.overdue}</b></div></section><div class="grid"><section class="panel"><h2>乡镇风险统计</h2><div class="towns">${towns(risks)}</div><p class="notice">红色：高风险线索；橙色：需优先核查；黄色：常规跟进。分数仅用于排序展示。</p></section><section class="panel"><h2>进行中的专项整治</h2>${campaigns.map(x=>`<p><b>${esc(x.name)}</b><br><small>${esc(x.scope)} · 截止 ${x.deadline} · ${x.status}</small></p>`).join('')||'<p>暂无专项整治。</p>'}${user.role==='县级'?`<div class="new"><input id="campaignName" placeholder="例如：节前集市食品安全检查"><input id="deadline" type="date" value="${new Date(Date.now()+7*86400000).toISOString().slice(0,10)}"><button class="primary" id="newCampaign">用已选风险立项</button></div>`:''}</section></div><section class="panel" style="margin-top:17px"><h2>风险清单 ${user.role==='县级'?'<small>（勾选后可纳入新专项）</small>':''}</h2><table><thead><tr>${user.role==='县级'?'<th></th>':''}<th>编号 / 主体</th><th>乡镇</th><th>线索</th><th>等级</th><th>风险状态</th></tr></thead><tbody>${risks.map(x=>`<tr>${user.role==='县级'?`<td><input type="checkbox" class="risk" value="${x.id}"></td>`:''}<td><b>${x.code}</b><br>${esc(x.subject)}</td><td>${esc(x.town)}</td><td>${esc(x.source)}<br><small>演示分数：${x.score}</small></td><td>${lvl(x.level)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></section><section class="panel" style="margin-top:17px"><h2>处置任务</h2><table><thead><tr><th>事项</th><th>乡镇</th><th>状态</th><th>当前责任人</th><th>截止</th><th></th></tr></thead><tbody>${tasks.map(x=>`<tr><td>${lvl(x.level)} ${esc(x.subject)}</td><td>${esc(x.town)}</td><td class="status">${esc(x.status)}</td><td>${esc(x.assignee||'待分派')}</td><td>${x.due_date}</td><td><button class="rowbtn" data-task="${x.id}">查看 / 处理</button></td></tr>`).join('')}</tbody></table></section></div>`;document.querySelector('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});login()};document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>detail(b.dataset.task));if(user.role==='县级')document.querySelector('#newCampaign').onclick=createCampaign}
async function createCampaign(){let name=document.querySelector('#campaignName').value,deadline=document.querySelector('#deadline').value,ids=[...document.querySelectorAll('.risk:checked')].map(x=>+x.value);try{await api('/api/campaign',{method:'POST',body:JSON.stringify({name,deadline,risk_ids:ids})});load()}catch(e){alert(e.message)}}
function actionForm(t,u){let townGrid={'青禾镇':'grid_a','临江镇':'grid_b','石桥镇':'grid_c'}[t.town],townOwner={'青禾镇':'town_a','临江镇':'town_b','石桥镇':'town_c'}[t.town];if(t.status==='待分派'&&u.role==='县级')return `<button class="primary" data-action="assign" data-assignee="${townOwner}">派给${townOwner}（属地负责人）</button>`;if(t.status==='待乡镇派发'&&u.role==='乡镇'&&u.id===t.assignee)return `<label>核查重点<textarea id="note" placeholder="例如：核对台账、现场检查后厨卫生"></textarea></label><button class="primary" data-action="delegate" data-assignee="${townGrid}">派给${townGrid}（属地网格员）</button>`;if(t.status==='待网格核查'&&u.role==='网格'&&u.id===t.assignee)return `<label>发现项<textarea id="finding" placeholder="填写发现的问题或核查结果"></textarea></label><label>整改结果<textarea id="rectification" placeholder="填写现场整改、限期整改或无异常说明"></textarea></label><button class="primary" data-action="submit">提交乡镇复核</button>`;if(t.status==='待乡镇复核'&&u.role==='乡镇'&&u.id===t.town_owner)return `<label>乡镇复核结论<textarea id="note" placeholder="确认材料、整改结果和是否上报县级"></textarea></label><button class="primary" data-action="town_review">提交县级复核</button>`;if(t.status==='待县级复核'&&u.role==='县级')return `<label>县级复核意见<textarea id="note" placeholder="填写销号结论，或退回补充原因"></textarea></label><div><button class="ghost" data-action="return">退回网格补充（截止自动顺延 3 天）</button> <button class="primary" data-action="close">复核销号</button></div>`;return '<span>当前账号没有可执行的下一步，或任务已完成。</span>'}
async function detail(id){let d=await api('/api/task/'+id),t=d.task,u=state.user;let box=document.createElement('div');box.className='modal';box.innerHTML=`<div><button class="ghost" style="float:right" id="close">关闭</button><div class="eyebrow">${t.town} · ${t.level}色风险</div><h2>${esc(t.subject)}</h2><p>状态：<b>${t.status}</b>　当前责任人：${esc(t.assignee||'待分派')}　截止：${t.due_date}</p><p>发现项：${esc(t.finding||'暂无')}<br>整改结果：${esc(t.rectification||'暂无')}<br>乡镇复核：${esc(t.town_review||'暂无')}</p><div class="actions">${actionForm(t,u)}</div><div class="timeline"><b>处理记录</b>${d.events.map(e=>`<div class="event"><b>${esc(e.action)}</b>　${esc(e.actor)}<br><small>${esc(e.note||'')}</small><br><time>${e.created_at}</time></div>`).join('')}</div></div>`;document.body.append(box);box.querySelector('#close').onclick=()=>box.remove();box.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{let body={action:b.dataset.action,assignee:b.dataset.assignee,note:box.querySelector('#note')?.value||'',finding:box.querySelector('#finding')?.value||'',rectification:box.querySelector('#rectification')?.value||''};try{await api('/api/task/'+id,{method:'POST',body:JSON.stringify(body)});box.remove();load()}catch(e){alert(e.message)}})}
async function load(){try{state=await api('/api/state');render()}catch(e){login()}}load();
</script></body></html>
